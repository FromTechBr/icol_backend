spring:
  flyway:
    clean-disabled: false
  jpa:
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-testing-with-at-least-256-bits-long}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    "[org.springframework.web]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
