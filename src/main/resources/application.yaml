# yaml-language-server: $schema=../../../../.vscode/spring-boot-schema.json
spring:
  application:
    name: icolsystem

  # ===============================
  # CONFIGURAÇÕES DO BANCO DE DADOS
  # ===============================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/icol_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ===============================
  # CONFIGURAÇÕES DO JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[use_get_generated_keys]": true

  flyway:
    clean-disabled: true

# ===============================
# CONFIGURAÇÕES DO SERVIDOR
# ===============================
server:
  port: 6060
  servlet:
    context-path: /api

# ===============================
# CONFIGURAÇÕES DE SEGURANÇA (JWT)
# ===============================
jwt:
  # O valor padrão foi removido por segurança. Ele DEVE ser passado pelo ambiente.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ===============================
# CONFIGURAÇÕES DE LOGGING
# ===============================
logging:
  level:
    root: INFO
    "[org.hibernate.orm.jdbc.bind]": WARN
    HTTP_REQUESTS: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true